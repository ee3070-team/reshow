<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="../../">
    <title>ReShow image upload browser fixture</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/exhibits.css">
    <script type="module" src="checks/fixtures/image-upload-browser.js"></script>
  </head>
  <body>
    <main style="margin-left:0">
      <header class="page-header">
        <div>
          <h1>ReShow image upload fixture</h1>
          <p>Local browser fixture with simulated uploads and records</p>
        </div>
        <div class="header-actions" data-fixture-controls hidden>
          <button type="button" class="button" data-show-page="exhibits">Exhibits</button>
          <button type="button" class="button" data-show-page="labels">Labels</button>
          <button type="button" class="button" data-sample-image>Choose sample PNG</button>
          <button type="button" class="button" data-fail-upload>Fail next upload</button>
        </div>
      </header>
      <p data-browser-result aria-live="polite">Loading fixture…</p>
      <div id="page-content"></div>
    </main>
    <div id="toast-region" class="toast-region" role="status"></div>
  </body>
</html>
