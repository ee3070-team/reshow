name: ReShow backend

on:
  pull_request:
    branches: [master]
    paths: ['backend/**', '.github/workflows/backend-ci.yml', 'scripts/sonar.py']
  push:
    branches: [master, 'codex/backend-ci']
    paths: ['backend/**', '.github/workflows/backend-ci.yml', 'scripts/sonar.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and API contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-*.txt
      - run: python -m pip install --only-binary=:all: -r requirements-test.txt
      - run: python -m unittest discover -s tests -v

  quality:
    name: SonarQube security gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start disposable SonarQube
        run: |
          sudo sysctl -w vm.max_map_count=524288
          docker run -d --name backend-sonar -p 127.0.0.1:9000:9000 sonarqube:26.10.0.133078-community
          python3 scripts/sonar_ci.py bootstrap
      - name: Scan backend
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        env:
          SONAR_HOST_URL: http://127.0.0.1:9000
        with:
          projectBaseDir: backend
          args: -Dsonar.ci.autoconfig.disabled=true
      - run: python3 scripts/sonar_ci.py report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-sonar-report
          path: backend/sonar-report/
          if-no-files-found: warn
          retention-days: 14
      - run: python3 scripts/sonar_ci.py enforce
      - name: Stop disposable SonarQube
        if: always()
        run: docker rm -f backend-sonar

  build:
    name: Build and smoke-test Lambda package
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build Lambda ZIP for Linux arm64
        run: |
          python -m pip install --target runtime-dependencies --platform manylinux_2_28_aarch64 --platform manylinux_2_17_aarch64 --implementation cp --python-version 3.13 --only-binary=:all: -r requirements-runtime.txt
          mkdir -p dist
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from deploy import package_backend

          archive = Path('dist/reshow-backend.zip')
          checksum = package_backend(Path('backend'), archive)
          archive.with_suffix('.sha256').write_text(checksum + '\n')
          PY
      - name: Smoke-test the extracted deployment package
        run: |
          python -m zipfile -e dist/reshow-backend.zip "$RUNNER_TEMP/reshow-backend"
          cd "$RUNNER_TEMP/reshow-backend"
          python - <<'PY'
          import json
          import app
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          assert AESGCM.generate_key(bit_length=128)
          for path in ('/api/health', '/openapi.json', '/docs'):
              result = app.lambda_handler({'version': '2.0', 'rawPath': path,
                  'requestContext': {'http': {'method': 'GET'}}}, None)
              assert result['statusCode'] == 200, (path, result['statusCode'])
              if path == '/api/health':
                  assert json.loads(result['body'])['service'] == 'reshow-demo-api'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reshow-backend-lambda
          path: backend/dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy and verify production Lambda
    needs: [quality, build]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.RESHOW_BACKEND_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: reshow-backend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reshow-backend-lambda
          path: ${{ runner.temp }}/reshow-deployment
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.RESHOW_BACKEND_DEPLOY_ROLE_ARN }}
          role-session-name: reshow-backend-${{ github.run_id }}
          aws-region: us-east-1
          allowed-account-ids: '835822826851'
          role-duration-seconds: 1200
      - run: python3 backend/scripts/deploy_ci.py "$RUNNER_TEMP/reshow-deployment/reshow-backend.zip"
