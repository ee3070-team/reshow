<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">What is inside an RFID card</title>
  <desc id="description">An RFID card mainly stores a UID number. The server uses that UID to find a staff card or an exhibit tag.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px sans-serif; fill: #475569; }
      .card-title { font: 700 22px sans-serif; fill: #fff; }
      .text { font: 700 22px sans-serif; fill: #0f172a; }
      .uid { font: 700 27px monospace; fill: #1e3a8a; }
      .small { font: 400 17px sans-serif; fill: #475569; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow); }
      .box { fill: #fff; stroke: #bfdbfe; stroke-width: 2; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1200" height="700" fill="url(#background)"/>
  <text x="600" y="58" text-anchor="middle" class="title">What is inside an RFID card?</text>
  <text x="600" y="92" text-anchor="middle" class="subtitle">Usually only an ID number is needed. The website and server store the important details.</text>

  <rect x="40" y="150" width="300" height="240" rx="20" class="box"/>
  <rect x="40" y="150" width="300" height="58" rx="20" fill="#2563eb"/>
  <rect x="40" y="192" width="300" height="16" fill="#2563eb"/>
  <text x="190" y="188" text-anchor="middle" class="card-title">RFID card</text>

  <rect x="78" y="230" rx="12" width="224" height="75" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="190" y="258" text-anchor="middle" class="small">Stored card UID</text>
  <text x="190" y="290" text-anchor="middle" class="uid">FC6AB516</text>
  <text x="190" y="345" text-anchor="middle" class="small">The number identifies the card</text>

  <path d="M340 270 H430" class="arrow"/>

  <rect x="430" y="150" width="300" height="240" rx="20" class="box"/>
  <rect x="430" y="150" width="300" height="58" rx="20" fill="#0f766e"/>
  <rect x="430" y="192" width="300" height="16" fill="#0f766e"/>
  <text x="580" y="188" text-anchor="middle" class="card-title">ESP32</text>
  <text x="580" y="245" text-anchor="middle" class="text">Read the UID</text>
  <text x="580" y="290" text-anchor="middle" class="uid">FC6AB516</text>
  <text x="580" y="337" text-anchor="middle" class="small">Send the UID to the server</text>

  <path d="M730 270 H820" class="arrow"/>

  <rect x="820" y="150" width="340" height="240" rx="20" class="box"/>
  <rect x="820" y="150" width="340" height="58" rx="20" fill="#7c3aed"/>
  <rect x="820" y="192" width="340" height="16" fill="#7c3aed"/>
  <text x="990" y="188" text-anchor="middle" class="card-title">Server database</text>
  <text x="990" y="245" text-anchor="middle" class="text">UID lookup</text>
  <text x="990" y="286" text-anchor="middle" class="small">FC6AB516 = Employee card</text>
  <text x="990" y="320" text-anchor="middle" class="small">A1B2C3D4 = Exhibit ex-014</text>

  <rect x="40" y="470" width="520" height="150" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="640" y="470" width="520" height="150" rx="20" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>

  <text x="300" y="515" text-anchor="middle" class="text">Employee card</text>
  <text x="300" y="552" text-anchor="middle" class="small">UID -> staff name -> permission</text>
  <text x="300" y="586" text-anchor="middle" class="small">Authorized cards may control the door</text>

  <text x="900" y="515" text-anchor="middle" class="text">Exhibit tag</text>
  <text x="900" y="552" text-anchor="middle" class="small">UID -> exhibit ID -> settings</text>
  <text x="900" y="586" text-anchor="middle" class="small">The tag must not open the door by itself</text>
</svg>
